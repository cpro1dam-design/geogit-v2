<!--
  ============================================================
  GEOWORLD LOADER — Module Code Divi (WordPress)
  ------------------------------------------------------------
  À COLLER tel quel dans un module « Code » Divi.

  Personnalisation rapide : modifiez les variables --gl-*
  dans le bloc <style> ci-dessous.

  Image de la Terre : remplacez l'URL de --gl-earth-img par
  celle de votre médiathèque WordPress, p. ex.
  url('/wp-content/uploads/2026/06/earth.jpg')
  ============================================================
-->
<div class="geoworld-loader" role="status" aria-live="polite" aria-label="Chargement de Geoworld">
  <h2 class="geoworld-loader__title">Geoworld</h2>

  <div class="geoworld-loader__stage" aria-hidden="true">
    <div class="geoworld-loader__ring"><span></span></div>
    <div class="geoworld-loader__earth"></div>
  </div>

  <span class="geoworld-loader__sr-only">Chargement en cours…</span>
</div>

<style>
  /* Tout est scopé sous .geoworld-loader : aucun style ne fuit dans la page Divi */
  .geoworld-loader {
    /* --- Variables personnalisables --- */
    --gl-bg: #182357;              /* fond de la scène */
    --gl-accent: #00fff9;          /* couleur lumineuse de l'anneau */
    --gl-glow: #03a9f4;            /* halo autour de la Terre */
    --gl-title-color: #ffffff;
    --gl-size: clamp(180px, 40vw, 400px);   /* diamètre de l'anneau (responsive) */
    --gl-earth-scale: 0.85;        /* taille de la Terre relative à l'anneau */
    --gl-spin: 4s;                 /* vitesse de rotation de l'anneau */
    --gl-earth-spin: 20s;          /* vitesse de défilement de la Terre */
    --gl-earth-img: url('https://raw.githubusercontent.com/Call-Damien/assets/main/earth.jpg');

    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vw, 40px);
    width: 100%;
    min-height: clamp(320px, 60vh, 640px);
    padding: 2rem 1rem;
    background-color: var(--gl-bg);
    border-radius: 12px;
    overflow: hidden;
    font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Reset uniquement local, sans toucher au reste de la page */
  .geoworld-loader *,
  .geoworld-loader *::before,
  .geoworld-loader *::after {
    box-sizing: border-box;
  }

  .geoworld-loader__title {
    margin: 0;
    color: var(--gl-title-color);
    font-size: clamp(1.8rem, 6vw, 4rem);
    font-weight: 600;
    line-height: 1.1;
  }

  .geoworld-loader__stage {
    position: relative;
    display: grid;
    place-items: center;
    width: var(--gl-size);
    height: var(--gl-size);
  }

  .geoworld-loader__ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    animation: gl-spin var(--gl-spin) linear infinite;
  }

  /* Demi-disque lumineux qui balaie l'anneau */
  .geoworld-loader__ring::before {
    content: '';
    position: absolute;
    inset-block: 0;
    inset-inline-start: 0;
    width: 50%;
    background: linear-gradient(to top, transparent, color-mix(in srgb, var(--gl-accent) 40%, transparent));
    border-start-start-radius: 50%;
    border-end-start-radius: 50%;
  }

  /* Point lumineux en tête de l'anneau */
  .geoworld-loader__ring::after {
    content: '';
    position: absolute;
    inset-block-start: 0;
    inset-inline-start: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: var(--gl-accent);
    border-radius: 50%;
    z-index: 10;
    box-shadow:
      0 0 10px var(--gl-accent), 0 0 20px var(--gl-accent),
      0 0 40px var(--gl-accent), 0 0 60px var(--gl-accent),
      0 0 90px var(--gl-accent);
  }

  /* Masque central qui crée l'anneau creux */
  .geoworld-loader__ring span {
    position: absolute;
    inset: 2.5%;
    background: var(--gl-bg);
    border-radius: 50%;
  }

  .geoworld-loader__earth {
    position: absolute;
    width: calc(var(--gl-size) * var(--gl-earth-scale));
    height: calc(var(--gl-size) * var(--gl-earth-scale));
    border-radius: 50%;
    background-image: var(--gl-earth-img);
    background-size: cover;
    box-shadow:
      inset 0 0 20px var(--gl-glow),
      0 0 120px var(--gl-glow);
    animation: gl-earth var(--gl-earth-spin) linear infinite;
  }

  /* Texte visible uniquement par les lecteurs d'écran */
  .geoworld-loader__sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @keyframes gl-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes gl-earth {
    from { background-position: 0; }
    to   { background-position: 162.5%; }
  }

  /* Respecte la préférence « réduire les animations » */
  @media (prefers-reduced-motion: reduce) {
    .geoworld-loader__ring,
    .geoworld-loader__earth {
      animation: none;
    }
  }
</style>
